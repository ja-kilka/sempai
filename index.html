<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaMen — Норма воды</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo" aria-label="AquaMen — Главная">
                <span class="logo-text">Aqua</span>
                <svg class="logo-icon" viewBox="0 0 60 80" width="38" height="50">
                    <polygon points="8,8 52,8 46,72 14,72" fill="#ffffff" stroke="#1e2842" stroke-width="3" stroke-linejoin="round"/>
                    <polygon points="10,26 50,26 45,68 15,68" fill="#2ea8e6"/>
                    <ellipse cx="30" cy="26" rx="20" ry="4" fill="#63d2ff"/>
                    <ellipse cx="30" cy="8" rx="22" ry="4.5" fill="#ffffff" stroke="#1e2842" stroke-width="3"/>
                </svg>
                <span class="logo-text">Men</span>
            </a>

            <button id="theme-toggle" class="theme-btn" type="button" aria-label="Переключить тему" title="Сменить тему">
                ☀️
            </button>
        </div>
    </header>

    <main class="main-content">

        <section class="calculator-section">
            <div class="info-card">
                <p>Узнайте вашу норму воды на день</p>
            </div>
            
            <div class="inputs-group">
                <label class="pill-box input-label" for="weight-input">
                    <input type="number" id="weight-input" placeholder="Ваш вес (кг)" min="1" max="350" step="0.1">
                </label>
                <div class="pill-box">
                    <span id="norm-output">Ваша норма...</span>
                </div>
            </div>
        </section>

        <div class="section-banner">
            <h2>Сколько воды в разной еде?</h2>
        </div>

        <section class="food-container">
            <div class="food-item">
                <div class="food-left">
                    <img src="image 26 (1).png" alt="Яблоко" class="food-icon">
                    <span class="food-name">Яблоко</span>
                </div>
                <span class="food-water">Около 86 г воды на 100г</span>
            </div>

            <div class="food-item">
                <div class="food-left">
                    <img src="image 27 (1).png" alt="Арбуз" class="food-icon">
                    <span class="food-name">Арбуз</span>
                </div>
                <span class="food-water">Около 91 г воды на 100г</span>
            </div>

            <div class="food-item">
                <div class="food-left">
                    <img src="image 28 (1).png" alt="Тыква" class="food-icon">
                    <span class="food-name">Тыква</span>
                </div>
                <span class="food-water">Около 91 г воды на 100г</span>
            </div>

            <div class="food-item">
                <div class="food-left">
                    <img src="Carrot_JE3_BE2.png" alt="Морковка" class="food-icon">
                    <span class="food-name">Морковка</span>
                </div>
                <span class="food-water">Около 88 г воды на 100 г</span>
            </div>
        </section>

        <section class="action-buttons">
            <a href="tips.html" class="nav-pill">Полезные советы</a>
            <a href="premium.html" class="nav-pill">Премиум подписка</a>
        </section>

    </main>

    <footer class="footer">
        <p class="footer-text">Есть вопросы? свяжитесь с нами!</p>
        <div class="social-links">
            <a href="#" aria-label="Instagram">
                <img src="image 1 (3).png" alt="Instagram" class="social-icon">
            </a>
            <a href="#" aria-label="X (Twitter)">
                <img src="image 6.png" alt="X" class="social-icon">
            </a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
